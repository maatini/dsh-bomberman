apiVersion: apps/v1
kind: Deployment
metadata:
  name: bomber-grid
  labels:
    app.kubernetes.io/name: bomber-grid
    app.kubernetes.io/component: server
spec:
  # Rooms live in memory on this pod. Do not scale this Deployment above one
  # replica without introducing shared room state or a room-aware routing layer.
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 120
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: bomber-grid
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bomber-grid
        app.kubernetes.io/component: server
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: bomber-grid:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: bomber-grid-config
          ports:
            - name: http
              containerPort: 4301
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
