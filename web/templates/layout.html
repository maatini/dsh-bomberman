{{define "head"}}
<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Bomber Grid – ein serverautoritativer Multiplayer-Bomberman-Clone mit Go, HTMX und WebSockets.">
  <title>{{.Title}}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/vendor/htmx.min.js" defer></script>
  <script src="/static/vendor/idiomorph-ext.min.js" defer></script>
  <script src="/static/vendor/htmx-ws.min.js" defer></script>
  <script src="/static/js/game.js" defer></script>

{{define "foot"}}

    <span><strong>BOMBER GRID</strong> · serverautoritativ in Go</span>

  </footer>
</body>
</html>
{{end}}

{{define "brand"}}
<a class="brand" href="/" aria-label="Bomber Grid Startseite">

  <span>BOMBER<span class="brand-accent">GRID</span></span>
